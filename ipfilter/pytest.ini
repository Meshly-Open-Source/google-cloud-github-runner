# Separate from the repository's pytest.ini, which sets `testpaths = ipfilter/tests` and
# `--cov=app` for the application's own suite. That file belongs to the project
# and this fork does not edit it, so this package carries its own config and is
# run explicitly:
#
#   python -m pytest -c ipfilter/pytest.ini ipfilter/tests
#
# The directory is passed EXPLICITLY and that is not redundant. `testpaths` is
# resolved against pytest's inferred rootdir, and the inference differs between
# a bare run and one with arguments -- a bare run here resolved `tests` to the
# PROJECT's suite instead of this package's, which needs Flask installed and so
# failed collection with an import error. An explicit path overrides testpaths
# in every case. A proof command that only works when invoked one particular
# way is not a proof command.
#
# No coverage addopts: coverage of this package is not the claim being made.
# The claim is that each named behaviour is asserted, and a coverage percentage
# would let a test that executes a line without checking its result stand in
# for one that does.
[pytest]
testpaths = ipfilter/tests
python_files = test_*.py
python_functions = test_*
addopts = -v --tb=short --strict-markers
